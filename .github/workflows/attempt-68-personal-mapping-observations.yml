name: Attempt 68 Personal Mapping Observations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  store-personal-observations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: emotional_translator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d emotional_translator_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/emotional_translator_test
      AUTH_SECRET: github-actions-attempt-68-test-secret-more-than-32-characters
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run migrate
      - run: npm test
      - name: Apply the backward-compatible personal observation schema
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          NODE_ENV: production
        run: npm run migrate
      - name: Store Elijah personal color mapping observations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          NODE_ENV: production
          ALLOW_PRODUCTION_PERSONAL_OBSERVATIONS: 1
          ATTEMPT_68_OWNER_USERNAME: elijah_duclair
          ATTEMPT_68_REPORT: attempt-68-personal-mapping-observations.json
        run: AUTH_SECRET="$(openssl rand -hex 32)" node scripts/run-attempt-68-personal-mapping-observations.js
      - name: Publish the observation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attempt-68-personal-mapping-observations
          path: backend/attempt-68-personal-mapping-observations.json
          if-no-files-found: warn
