name: Attempt 67 Flow Gray Personal Placement

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  place-personal-relationship:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: emotional_translator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d emotional_translator_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/emotional_translator_test
      AUTH_SECRET: github-actions-attempt-67-test-secret-more-than-32-characters
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run migrate
      - run: npm test
      - name: Wait for the deployed personal placement capability
        shell: bash
        run: |
          for attempt in {1..40}; do
            response="$(curl --fail --silent --show-error https://eli-emotional-translator-api.onrender.com/api/health || true)"
            if printf '%s' "$response" | grep -q '"personalGraphPlacement":"personal-receipt-placement-v1"'; then
              printf '%s\n' "$response"
              exit 0
            fi
            sleep 15
          done
          printf '%s\n' 'Timed out waiting for personal-receipt-placement-v1.' >&2
          exit 1
      - name: Place flow to Gray in Elijah personal graph
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          NODE_ENV: production
          ALLOW_PRODUCTION_PERSONAL_PLACEMENT: 1
          ATTEMPT_67_OWNER_USERNAME: elijah_duclair
          ATTEMPT_67_REPORT: attempt-67-flow-gray-personal.json
        run: AUTH_SECRET="$(openssl rand -hex 32)" node scripts/run-attempt-67-flow-gray-personal.js
      - name: Publish the personal placement report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attempt-67-flow-gray-personal
          path: backend/attempt-67-flow-gray-personal.json
          if-no-files-found: warn
